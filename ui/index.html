<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inspection Agent</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Inspection Agent</h1>
      <div id="signin-banner" class="signin-banner">
        <span id="signin-email" class="signin-email"></span>
        <button id="signout-btn" type="button" class="signout-btn">Sign out</button>
      </div>
    </header>

    <main class="chat">
      <section class="chat-controls">
        <button id="new-conversation-btn" type="button" class="new-conversation-btn">
          New Conversation
        </button>
        <span id="loading-indicator" class="loading-indicator" hidden>Thinking...</span>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label for="prompt-input" class="visually-hidden">Ask a question</label>
        <textarea
          id="prompt-input"
          class="prompt-input"
          placeholder="Ask a question about inspection reports..."
          rows="2"
        ></textarea>
        <button id="send-btn" type="submit" class="send-btn">Send</button>
      </form>
    </main>
  </div>
</body>
</html>
